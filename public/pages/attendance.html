<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الحضور - SALONIX</title>
  <link rel="stylesheet" href="../assets/css/shared.css">
  <link rel="stylesheet" href="../assets/css/pages/attendance.css">
</head>
<body>
  <div class="attendance-app">
    <header class="attendance-header">
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="فتح القائمة">☰</button>
      <div>
        <p class="eyebrow">SALONIX · ATTENDANCE</p>
        <h1>الحضور اليومي</h1>
        <p>الأوقات من الخادم، والجدول المعتمد هو مصدر خطة اليوم.</p>
      </div>
      <div class="sync-state" id="syncState" role="status" aria-live="polite">جارٍ المزامنة…</div>
    </header>

    <main>
      <section class="toolbar panel" aria-label="مرشحات الحضور">
        <label>التاريخ <input id="attendanceDate" type="date"></label>
        <label>الفرع <select id="branchFilter"><option value="">كل الفروع</option></select></label>
        <label>الموظف <select id="staffFilter"><option value="">كل الموظفين</option></select></label>
        <label class="check-filter"><input id="unresolvedFilter" type="checkbox"> حالات تحتاج مراجعة</label>
        <label class="check-filter"><input id="openBreakFilter" type="checkbox"> بريك مفتوح</label>
        <button id="refreshBtn" type="button" class="primary">تحديث</button>
        <button id="migrationPreviewBtn" type="button" class="soft" hidden>معاينة تهيئة الجداول</button>
      </section>

      <section class="summary-grid" aria-label="ملخص الحضور">
        <article><span>الموظفون</span><strong id="totalCount">0</strong></article>
        <article><span>داخل العمل</span><strong id="workingCount">0</strong></article>
        <article><span>بريك مفتوح</span><strong id="breakCount">0</strong></article>
        <article><span>غير محلول</span><strong id="warningCount">0</strong></article>
      </section>

      <div id="pageMessage" class="page-message" role="alert" aria-live="assertive" hidden></div>
      <section id="attendanceCards" class="attendance-cards" aria-label="بطاقات الموظفين" aria-busy="true"></section>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
    <h3>Menu</h3>
    <button class="sidebar-link active" type="button">Attendance</button>
    <button class="sidebar-link" type="button" data-href="schedule-management.html">Staff Scheduling</button>
    <button class="sidebar-link" type="button" data-href="dashboard.html">Dashboard</button>
    <button type="button" id="logoutBtn">Logout</button>
  </aside>

  <dialog id="actionDialog" aria-labelledby="actionDialogTitle">
    <form method="dialog" id="actionForm">
      <div class="dialog-head">
        <h2 id="actionDialogTitle">تأكيد الإجراء</h2>
        <button type="button" data-close-dialog aria-label="إغلاق">×</button>
      </div>
      <input id="actionName" type="hidden">
      <input id="actionStaffId" type="hidden">
      <input id="actionDayId" type="hidden">
      <label>السبب / ملاحظة اليوم <textarea id="actionReason" required rows="3"></textarea></label>
      <label id="approvedMinutesField" hidden>الدقائق المعتمدة
        <input id="approvedMinutes" type="number" min="0" step="1">
      </label>
      <label id="correctionTypeField" hidden>نوع التصحيح
        <select id="correctionType">
          <option value="INSERT_EVENT">إضافة حدث مفقود</option>
          <option value="REPLACE_TIMESTAMP">تصحيح وقت حدث</option>
        </select>
      </label>
      <label id="correctionEventField" hidden>نوع الحدث
        <select id="correctionEventType">
          <option value="CHECK_IN">حضور</option>
          <option value="BREAK_START">بداية بريك</option>
          <option value="BREAK_END">نهاية بريك</option>
          <option value="CHECK_OUT">انصراف</option>
        </select>
      </label>
      <label id="correctionTimeField" hidden>الوقت المصحح
        <input id="correctionEventAt" type="datetime-local">
      </label>
      <div class="dialog-actions">
        <button type="button" class="soft" data-close-dialog>إلغاء</button>
        <button type="submit" class="primary" id="confirmActionBtn">تأكيد</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailsDialog" aria-labelledby="detailsDialogTitle">
    <div class="dialog-head">
      <h2 id="detailsDialogTitle">تفاصيل اليوم وسجل التدقيق</h2>
      <button type="button" data-close-dialog aria-label="إغلاق">×</button>
    </div>
    <div id="detailsContent"></div>
  </dialog>

  <script src="../assets/js/utils/text-fix.js"></script>
  <script src="../assets/js/core/runtime-config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/js/utils/layout.js"></script>
  <script src="../assets/js/utils/keyboard-navigation.js"></script>
  <script src="../assets/js/utils/language.js"></script>
  <script src="../assets/js/pages/attendance.js"></script>
</body>
</html>
